# Vonng.com — Hugo site configuration
#
# Theme: OINK v1.4.0 (github.com/pgsty/oink)
# Structure: top-level sections are blog columns; `/` is a landing page.

baseURL: https://vonng.com
title: VONNG
defaultContentLanguage: zh-cn
enableRobotsTXT: true
# `hugo server` only: lets an iframe-hosted giscus theme load during previews.
server:
  headers:
    - for: /**
      values:
        Access-Control-Allow-Origin: '*'
        Cache-Control: 'no-store, no-cache, must-revalidate'
enableEmoji: true
enableGitInfo: false
hasCJKLanguage: true
summaryLength: 30
buildDrafts: false
buildFuture: false

# Blowfish rendered author pages from data/authors/*.json; OINK renders them
# from the `authors` taxonomy, so the profile page and the byline can never
# disagree. `series` likewise drives the reading-order strip.
taxonomies:
  tag: tags
  category: categories
  author: authors
  series: series

# `markdown` powers Copy text / View source; `LLMS` emits llms.txt.
outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, markdown]

pagination:
  pagerSize: 24

imaging:
  anchor: Center
  resampleFilter: CatmullRom

sitemap:
  changefreq: weekly
  filename: sitemap.xml
  priority: 0.5

services:
  googleAnalytics:
    id: G-KTPE9LDZ2W
  rss:
    limit: 50

# Hugo does not merge a theme module's markup configuration, so OINK's three
# required Goldmark settings are written here.
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
    extensions:
      # Soft line breaks between CJK characters render as nothing (not a
      # collapsed space), so source files can wrap paragraphs at ~80-90 chars
      # without leaking spaces into the rendered Chinese text.
      cjk:
        enable: true
        eastAsianLineBreaks: true
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    noClasses: false
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false

related:
  threshold: 0
  toLower: false
  includeNewer: true
  indices:
    - { name: tags, weight: 100 }
    - { name: categories, weight: 100 }
    - { name: series, weight: 50 }
    - { name: authors, weight: 20 }
    - { name: date, weight: 10 }

module:
  # Hugo's own default here is `direct`, which fetches the theme with an
  # anonymous `git ls-remote` against GitHub on every cold build. Cloudflare
  # Pages' build container cannot do that — anonymous github.com git fails
  # there — so read the module from the Go proxy and keep git as the fallback
  # for a tag the proxy has not seen yet.
  proxy: https://proxy.golang.org,direct
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.168.0

# The About page reads its GitHub numbers from the live sources at build time
# (layouts/_partials/metrics.html); this keeps a day's builds off the network
# and lets an offline build serve the last answer instead of the fallback.
caches:
  getresource:
    maxAge: 24h

params:
  # -- Identity --------------------------------------------------------------
  logo: img/vonng-logo.svg
  images: [img/wusu.jpg]
  github_repo: https://github.com/Vonng/vonng.com
  github_project_repo: https://github.com/Vonng/vonng.com
  github_branch: main
  github_subdir: ''
  version: ''

  # -- Reading ---------------------------------------------------------------
  page_width: wide
  reading_width: normal
  time_format_blog: 2006-01-02
  time_format_default: 2006-01-02

  # -- Local search ----------------------------------------------------------
  offline_search: true
  offline_search_on_serve: true
  offline_search_index: summary
  offline_search_summary_length: 80
  offline_search_max_results: 12

  # -- Comments (ported from the Blowfish giscus partial) --------------------
  comments:
    enable: true
    type: giscus
    giscus:
      repo: Vonng/vonng.com
      repoId: MDEwOlJlcG9zaXRvcnkxMTQwNzczNjI=
      category: Announcements
      categoryId: DIC_kwDOBsyuss4CtpY7
      mapping: pathname
      strict: 0
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom
      # giscus built-ins rather than OINK's own palettes: the iframe loads from
      # giscus.app, so a stylesheet served from vonng.com would need a CORS
      # header on the production host to be readable at all.
      theme: auto
      lightTheme: light
      darkTheme: transparent_dark
      loading: lazy

  print:
    toc: true

  ui:
    preset: paper
    preset_menu: [paper, slate, ink, terminal]
    typography: technical
    dark_mode: true
    navbar_autohide: false
    footer_style: fat
    landing_search: true

    # -- Blog columns ------------------------------------------------------
    # Every top-level section of this site is a blog column, so the column
    # recipe is the site default rather than seven identical cascades:
    # a full-bleed Hero from the post's own featured image, a card grid for
    # the index, an in-flow outline rail, and no sidebar.
    featured_image: hero
    blog_index: cards
    blog_index_columns: 3
    blog_index_toggle: true
    blog_index_size: 24
    toc_style: flow
    toc_taxonomies: false
    sidebar_enabled: false
    section_index: cards
    section_index_columns: 3

    reading_time: true
    image_zoom: true
    annotation: true
    lastmod_commit: none
    keyboard_nav: true
    scroll_spy: true
    code_copy: true

    share: [x, telegram, linkedin, reddit, weibo, email, copy]

    taxonomy_icons:
      categories: fa-solid fa-folder
      tags: fa-solid fa-tags
      authors: fa-solid fa-user-pen
      series: fa-solid fa-layer-group

    quick_links: [db, pg]

    page_context_menu:
      enable: true
      assistant_links: true

    feedback:
      enable: false

