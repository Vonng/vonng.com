<script>
if (new URLSearchParams(location.search).has('export')) {
  document.documentElement.classList.add('export-mode');
}
async function exportCardToPng(cardEl, cssText, filename, btnEl) {
  try {
    if (btnEl) btnEl.style.opacity = '0.55';
    const clone = cardEl.cloneNode(true);
    clone.style.transformOrigin = '0 0';
    clone.style.transform = 'scale(4.40972222)';
    clone.style.boxShadow = 'none';
    clone.style.margin = '0';
    const serialized = new XMLSerializer().serializeToString(clone);
    const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><foreignObject x="0" y="0" width="1500" height="900"><div xmlns="http://www.w3.org/1999/xhtml" style="width:1500px;height:900px;overflow:hidden;margin:0;padding:0;-webkit-font-smoothing:antialiased;"><style><![CDATA[*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
${cssText}]]></style>${serialized}</div></foreignObject></svg>`;
    const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = dataUrl;
    });
    const canvas = document.createElement('canvas');
    canvas.width = 1500;
    canvas.height = 900;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 1500, 900);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  } finally {
    if (btnEl) btnEl.style.opacity = '';
  }
}
function downloadSingleCard(btnEl, filename) {
  const cardEl = document.querySelector('.card');
  const styleEl = document.getElementById('card-style');
  exportCardToPng(cardEl, styleEl ? styleEl.textContent : '', filename, btnEl);
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'l' || e.key === 'L') location.href = '/en/me/5/';
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'h' || e.key === 'H') location.href = '/en/me/3/';
});
</script>
