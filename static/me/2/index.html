<style id="card-style">
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {

  body {

  .card {

    --sumi: #1c1a17;
    --muted: #665f55;
    --hairline: rgba(28, 26, 23, 0.2);
    --cinnabar: #b62d1c;
    --serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "Georgia", serif;
    --sans: "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
    --mono: "JetBrains Mono", "SF Mono", "Menlo", monospace;
    width: 90mm;
    height: 54mm;
    background-color: var(--washi);
    background-image:
      radial-gradient(rgba(28, 26, 23, 0.03) 1px, transparent 0),

    background-size: 3mm 3mm, 100% 100%;
    color: var(--sumi);
    font-family: var(--serif);
    border-radius: 1.5mm;
    box-shadow: 0 26px 64px rgba(0, 0, 0, 0.48), 0 2px 8px rgba(0, 0, 0, 0.2);
    padding: 2.8mm 3.2mm;
    position: relative;
    overflow: hidden;
  }
  :where(.card) a { color: inherit; text-decoration: none; transition: color 0.12s ease; }
  .card a:hover { color: var(--cinnabar); }
  .frame {
    width: 100%; height: 100%;
    border: 0.35mm solid var(--sumi);
    padding: 0.55mm;
    display: flex;
  }
  .frame-inner {
    width: 100%; height: 100%;
    border: 0.2mm solid rgba(28, 26, 23, 0.35);
    display: grid;
    grid-template-columns: 51.0mm 1fr;
    padding: 2.2mm 2.4mm;
    gap: 2.0mm;
  }
  .left-col {
    display: flex; flex-direction: column; justify-content: space-between;
    padding-right: 1.8mm; border-right: 0.22mm solid var(--hairline);
  }
  .identity-head { display: flex; align-items: center; justify-content: space-between; gap: 2mm; }
  .name-block { display: flex; flex-direction: column; gap: 0.7mm; }
  .name-cn { font-size: 8.2mm; font-weight: 700; letter-spacing: 0.14em; line-height: 1.05; white-space: nowrap; }
  .name-en { font-family: var(--mono); font-size: 2.05mm; color: var(--muted); letter-spacing: 0.06em; white-space: nowrap; }
  .seal {
    width: 8.6mm; height: 8.6mm; background: var(--cinnabar); color: #f9f5ec;
    border-radius: 0.6mm; padding: 0.6mm;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
    place-items: center; font-family: var(--serif); font-size: 3.1mm; font-weight: 700; line-height: 1;
    box-shadow: inset 0 0 0 0.25mm rgba(249, 245, 236, 0.45); flex-shrink: 0;
  }
  .seal:hover { color: #fff; opacity: 0.92; }
  .titles-bar {
    padding: 1.3mm 0;
    border-top: 0.2mm solid var(--hairline);
    border-bottom: 0.2mm solid var(--hairline);
    display: flex; align-items: center; flex-wrap: nowrap;
    column-gap: 0.95mm;
    font-size: 1.78mm; font-weight: 700; letter-spacing: 0; white-space: nowrap;
  }
  .titles-bar .dot { color: var(--cinnabar); font-size: 1.3mm; }
  .contact-list {
    display: grid; grid-template-columns: 25.0mm 1fr;
    row-gap: 0.85mm; column-gap: 1.0mm;
    font-family: var(--mono); font-size: 1.62mm;
  }
  .contact-row { display: flex; align-items: baseline; gap: 0.8mm; white-space: nowrap; }
  .contact-row .k { font-family: var(--serif); font-size: 1.56mm; font-weight: 700; color: var(--cinnabar); flex-shrink: 0; }
  .contact-row .v { color: var(--sumi); font-weight: 500; letter-spacing: -0.02em; }
  .contact-row .v.cjk { font-family: var(--serif); font-weight: 700; }
  .right-col { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 0.2mm 0; }
  .motto { font-size: 1.72mm; letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
  .qr-wrap {
    width: 19.5mm; height: 19.5mm; padding: 0.95mm;
    background: #fcfaf5; border: 0.25mm solid var(--sumi); position: relative; display: block;
  }
  .qr-wrap::before, .qr-wrap::after {
    content: ""; position: absolute; width: 1.8mm; height: 1.8mm; border-color: var(--cinnabar); border-style: solid;
  }
  .qr-wrap::before { top: -0.5mm; left: -0.5mm; border-width: 0.45mm 0 0 0.45mm; }
  .qr-wrap::after { bottom: -0.5mm; right: -0.5mm; border-width: 0 0.45mm 0.45mm 0; }
  .qr-svg { width: 100%; height: 100%; display: block; color: var(--sumi); }
  .qr-caption { text-align: center; font-family: var(--mono); font-size: 1.62mm; color: var(--muted); letter-spacing: 0.01em; white-space: nowrap; }

  @media print {
    @page { size: 90mm 54mm; margin: 0; }
    html, body { background: none; padding: 0; margin: 0; min-height: auto; display: block; }
    .stage { zoom: 1 !important; display: block; }
    .card { box-shadow: none !important; border-radius: 0 !important; }
  }
</style>

<script>
if (new URLSearchParams(location.search).has('export')) {
  document.documentElement.classList.add('export-mode');
}
async function exportCardToPng(cardEl, cssText, filename, btnEl) {
  try {
    if (btnEl) btnEl.style.opacity = '0.55';
    const clone = cardEl.cloneNode(true);
    clone.style.transformOrigin = '0 0';
    clone.style.transform = 'scale(4.40972222)';
    clone.style.boxShadow = 'none';
    clone.style.margin = '0';
    const serialized = new XMLSerializer().serializeToString(clone);
    const svgStr = `<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900"><foreignObject x="0" y="0" width="1500" height="900"><div xmlns="http://www.w3.org/1999/xhtml" style="width:1500px;height:900px;overflow:hidden;margin:0;padding:0;-webkit-font-smoothing:antialiased;"><style><![CDATA[*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
${cssText}]]></style>${serialized}</div></foreignObject></svg>`;
    const dataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr);
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = dataUrl;
    });
    const canvas = document.createElement('canvas');
    canvas.width = 1500;
    canvas.height = 900;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 1500, 900);
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  } finally {
    if (btnEl) btnEl.style.opacity = '';
  }
}
function downloadSingleCard(btnEl, filename) {
  const cardEl = document.querySelector('.card');
  const styleEl = document.getElementById('card-style');
  exportCardToPng(cardEl, styleEl ? styleEl.textContent : '', filename, btnEl);
}
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === 'l' || e.key === 'L') location.href = '/me/3/';
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.key === 'h' || e.key === 'H') location.href = '/me/1/';
});
</script>
