# The home page, both languages in one file.
#
# Everything the home page shows is configured here — the hero copy, the column
# cards, the project and publication grids, and the closing call to action.
# Two of them read their contents from elsewhere: `recent` lists the newest
# posts straight from the content tree, and the `project` / `publication`
# grids take their cards from data/works.yaml, which the About page shares.
#
# Section entries name a partial under layouts/_partials/landing/sections/ when
# the theme has no section of that shape. Everything else is an OINK landing
# section: https://oink.pgsty.com/docs/customize/home/

zh-cn:
  sections:
    - type: hero
      partial: landing/sections/hero-featured.html
    - type: cards
      key: columns
      partial: landing/sections/column-cards.html
    - type: cards
      key: recent
      partial: landing/sections/recent-posts.html
    - type: cards
      key: project
      partial: landing/sections/link-cards.html
    - type: cards
      key: publication
      partial: landing/sections/link-cards.html
    - cta

  hero:
    eyebrow: 冯若航 · 数据库老司机 · 云计算泥石流
    title: 老冯云数
    lead: >-
      [冯若航](/about/)（[@Vonng](https://github.com/Vonng)）：[Pigsty](https://pigsty.cc/) 作者，
      [PGSTY](https://pgsty.com/zh) 创始人，[活跃](https://committers.top/china)[开源贡献者](https://gitstar-ranking.com/Vonng)。<br>
      [数据库老司机](/db/)，[云计算泥石流](/cloud/)，[PostgreSQL 大法师](/pg/)，[AI Agent 探路者](/ai/)。
    portrait: img/about/vonng.jpg
    portrait_alt: 冯若航

  columns:
    eyebrow: 专栏
    columns: 3
    unit: 篇
    items:
      - page: /db
        title: 数据库老司机
        desc: 数据库行业的动态、新闻、调查、理念与最佳实践。
      - page: /cloud
        title: 云计算泥石流
        desc: 云计算、下云与基础设施自建的深度思考与成本分析。
      - page: /ai
        title: Agent 探路者
        desc: 关于 AI、Agent、LLM，以及 AI 与数据库之间的一切。
      - page: /pg
        title: Postgres 大法师
        desc: PostgreSQL 生态进展，以及开发、运维、诊断与调优的经验。
      - page: /trip
        title: 行万里路
        desc: 旅行、徒步与、游记与见闻。山川湖海，风物人情。
      - page: /misc
        title: 人生旅途
        desc: 随笔与杂谈，闲杂记录，也许与技术有关，或者完全无关。

  recent:
    eyebrow: 最新文章
    limit: 12
    columns: 3
    more:
      - { label: 按标签浏览, url: tags/, icon: fa-solid fa-tags }
      - { label: 按作者浏览, url: authors/, icon: fa-solid fa-user-pen }

  project:
    eyebrow: 开源项目
    columns: 3
    items_from: project

  publication:
    eyebrow: 译作与著述
    columns: 3
    items_from: publication

  cta:
    title: 有问题，或者想聊聊？
    text: 欢迎在任何一篇文章下留言，也可以订阅 RSS，或者直接找我。
    actions:
      - { label: 关于我, url: about/, icon: fa-solid fa-circle-user, style: primary }
      - { label: 订阅 RSS, url: index.xml, icon: fa-solid fa-rss, style: ghost }
      - { label: GitHub, url: 'https://github.com/Vonng', icon: fa-brands fa-github, external: true, style: ghost }
      - { label: 写封邮件, url: 'mailto:rh@vonng.com', icon: fa-solid fa-envelope, style: ghost }

en:
  sections:
    - type: hero
      partial: landing/sections/hero-featured.html
    - type: cards
      key: columns
      partial: landing/sections/column-cards.html
    - type: cards
      key: recent
      partial: landing/sections/recent-posts.html
    - type: cards
      key: project
      partial: landing/sections/link-cards.html
    - type: cards
      key: publication
      partial: landing/sections/link-cards.html
    - cta

  hero:
    eyebrow: Ruohang Feng · Database Guru · Cloud Exiter
    title: Vonng's Blog
    # The four titles on the second line each link to their column.
    lead: >-
      [Ruohang Feng](/en/about/) ([@Vonng](https://github.com/Vonng)): [Pigsty](https://pigsty.io/) author, [PGSTY](https://pgsty.com/) founder,
      [OSS contributor](https://gitstar-ranking.com/Vonng).<br>
      [Database Guru](/en/db/), [Cloud Exiter](/en/cloud/), [PostgreSQL Mage](/en/pg/), and [AI Agent Explorer](/en/ai/).
    portrait: img/about/vonng.jpg
    portrait_alt: Ruohang Feng

  columns:
    eyebrow: Columns
    columns: 3
    unit: posts
    items:
      - page: /db
        title: Database Guru
        desc: News, insights, and best practices from the database industry.
      - page: /cloud
        title: Cloud-Exiter
        desc: Cloud-exit and self-hosting — deep dives and cost analyses.
      - page: /ai
        title: AI Agent Explorer
        desc: Agents, LLMs, and everything between AI and databases.
      - page: /pg
        title: Postgres Mage
        desc: Blogs about PG ecosystem, admin, development and operations.
      - page: /trip
        title: Travel Notes
        desc: Trips, hikes and the things seen along the way.
      - page: /misc
        title: Miscellaneous
        desc: The things that are not about technology, or not only about it.

  recent:
    eyebrow: Latest Posts
    limit: 12
    columns: 3
    more:
      - { label: Browse by tag, url: tags/, icon: fa-solid fa-tags }
      - { label: Browse by author, url: authors/, icon: fa-solid fa-user-pen }

  project:
    eyebrow: Projects
    columns: 3
    items_from: project

  publication:
    eyebrow: Publications
    columns: 3
    items_from: publication

  cta:
    title: Questions, or just want to talk?
    text: Leave a comment under any article, subscribe by RSS, or reach me directly.
    actions:
      - { label: About me, url: about/, icon: fa-solid fa-circle-user, style: primary }
      - { label: Subscribe, url: index.xml, icon: fa-solid fa-rss, style: ghost }
      - { label: GitHub, url: 'https://github.com/Vonng', icon: fa-brands fa-github, external: true, style: ghost }
      - { label: Email, url: 'mailto:rh@vonng.com', icon: fa-solid fa-envelope, style: ghost }
