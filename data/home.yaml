# The home page, both languages in one file.
#
# Everything the home page shows is configured here — the hero copy, the column
# cards, the recent articles, and the four portfolio pillars (`project`,
# `translation`, `works`, `sites`) sourced from data/works.yaml.

zh-cn:
  sections:
    - type: hero
      partial: landing/sections/hero-featured.html
    - type: cards
      key: columns
      partial: landing/sections/column-cards.html
    - type: cards
      key: recent
      partial: landing/sections/recent-posts.html
    - type: cards
      key: project
      partial: landing/sections/link-cards.html
    - type: cards
      key: works
      partial: landing/sections/link-cards.html
    - type: cards
      key: translation
      partial: landing/sections/link-cards.html
    - type: cards
      key: sites
      partial: landing/sections/link-cards.html
    - cta

  hero:
    eyebrow: 冯若航 · 数据库老司机 · 云计算泥石流 · PG 大法师
    title: 老冯云数
    lead: >-
      [冯若航](/about/)（[@Vonng](https://github.com/Vonng)）：开源 PostgreSQL 发行版 [Pigsty](https://pigsty.cc/) 作者，
      [PGSTY](https://pgsty.com/zh) 创始人，[活跃](https://committers.top/singapore)[开源贡献者](https://gitstar-ranking.com/Vonng)。<br>
      深耕[数据库](/db/)、[下云与自建基础设施](/cloud/)、[PostgreSQL 内核与生态](/pg/)，以及 [AI Agent 工程实践](/ai/)。
    actions:
      - { label: 关于老冯, url: about/, icon: fa-solid fa-circle-user, style: primary }
      - { label: GitHub, url: 'https://github.com/Vonng', icon: fa-brands fa-github, external: true, style: ghost }
      - { label: 名片, url: '/me/0/', icon: fa-solid fa-id-card, style: ghost }
      - { label: 公众号, url: '/wechat/', icon: fa-brands fa-weixin, style: ghost }
    portrait: img/about/vonng.jpg
    portrait_alt: 冯若航
    portrait_url: about/

  columns:
    eyebrow: 专栏
    text: 按领域划分的六个长青专栏，均提供独立的 RSS 订阅源。
    head_links:
      - { label: RSS, url: index.xml, icon: fa-solid fa-rss }
      - { label: 标签, url: tags/, icon: fa-solid fa-tags }
      - { label: 作者, url: authors/, icon: fa-solid fa-user-pen }
    columns: 3
    unit: 篇
    items:
      - page: /db
        title: 数据库老司机
        desc: 数据库行业的动态、新闻、调查、架构理念与工程最佳实践。
      - page: /cloud
        title: 云计算泥石流
        desc: 云计算经济学、下云浪潮与主权基础设施自建的深度思考。
      - page: /pg
        title: Postgres 大法师
        desc: PostgreSQL 生态演进，以及内核、开发、运维、诊断与调优实战。
      - page: /ai
        title: Agent 探路者
        desc: 关于 AI、Agent、LLM 工程落地，以及 AI 与数据库之间的一切。
      - page: /trip
        title: 行万里路
        desc: 旅行、徒步、游记与见闻。山川湖海，风物人情。
      - page: /misc
        title: 人生旅途
        desc: 随笔与杂谈，闲杂记录，也许与技术有关，或者完全无关。

  recent:
    eyebrow: 文章
    text: 覆盖全站所有专栏的最新 9 篇原创文章与深度译介。
    head_links:
      - { label: 全部文章, url: column/, icon: fa-solid fa-layer-group }
    limit: 9
    columns: 3

  project:
    eyebrow: 开源
    text: 围绕 PostgreSQL、对象存储、软件源分发、本地虚拟化与工程效率构建的 9 个核心开源项目。
    head_links:
      - { label: 全部项目, url: project/, icon: fa-solid fa-cubes }
      - { label: VONNG, url: 'https://github.com/Vonng', icon: fa-brands fa-github, external: true }
      - { label: PGSTY, url: 'https://github.com/pgsty', icon: fa-brands fa-github, external: true }
    columns: 3
    items_from: project

  works:
    eyebrow: 作品
    text: 围绕 PostgreSQL 生产工程与跨文明思想传统撰写的原创专著，以及数据库智能诊断与异构联邦查询领域的学术论文。
    head_links:
      - { label: 全部作品, url: works/, icon: fa-solid fa-compass-drafting }
      - { label: 贡献档案, url: dossier/, icon: fa-solid fa-id-card }
    columns: 2
    items_from: works

  translation:
    eyebrow: 翻译
    text: 独立翻译的计算机与 PostgreSQL 核心著作、教程及权威培训课程体系。
    head_links:
      - { label: 全部, url: translation/, icon: fa-solid fa-book-bookmark }
      - { label: 教程, url: 'https://pgsql.cc/docs/tutorials/', icon: fa-solid fa-book-open, external: true }
      - { label: 文档, url: 'https://doc.pg.center/zh', icon: fa-solid fa-language, external: true }
    columns: 3
    items_from: translation
    series_from: training_series

  sites:
    eyebrow: 站点
    text: 围绕 PostgreSQL 生态与开源基础设施构建的核心门户、扩展目录与官方站点。
    head_links:
      - { label: 全部站点, url: sites/, icon: fa-solid fa-globe }
    columns: 3
    items_from: sites

  cta:
    title: 有问题，或者想聊聊？
    text: 欢迎在任何一篇文章下留言讨论，也可以订阅全站 RSS，或者直接写信给我。
    actions:
      - { label: 关于老冯, url: about/, icon: fa-solid fa-circle-user, style: primary }
      - { label: 订阅 RSS, url: index.xml, icon: fa-solid fa-rss, style: ghost }
      - { label: 写封邮件, url: 'mailto:rh@vonng.com', icon: fa-solid fa-envelope, style: ghost }

