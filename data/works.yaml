    - title: SOW
      meta: 软件仓库管理器 · Apache-2.0
      image: img/works/sow.pgsty.com.webp
      desc: 一次入库，处处分发 —— 单二进制构建、快照与增量发布 APT/YUM 软件仓库。
      detail: '面向大规模 Linux 软件源分发的单二进制仓库管理器（Store Once, Serve Everywhere）。通过内容寻址包池（Content-Addressed Pool）统一管理 RPM 与 DEB 软件包，原生支持 GPG 签名、增量元数据索引生成、不可变版本快照以及本地目录/S3/R2 增量同步，驱动着 Pigsty 全球数万个软件包的构建与发布流水线。'
