# The project and publication card grids, both languages in one file.
#
# The same two grids appear on the home page and on the About page, so the
# items live here and both landing pages point at them:
#
#   - type: cards
#     key: project
#     partial: landing/sections/link-cards.html
#
#   project:
#     eyebrow: ...
#     items_from: project     # <- reads data/works.yaml, current language
#
# Item keys are the link-card keys: title, meta, desc, image, url, external.

zh-cn:

  # Open source projects
  project:
    - title: Pigsty
      meta: 开源 PG RDS 发行版
      image: img/works/pigsty.cc.webp
      desc: 开箱即用的 PostgreSQL 数据库发行版，本地优先的 FLOSS RDS。
      url: 'https://pigsty.cc'
      external: true
    - title: SILO
      meta: S3 兼容对象存储
      image: img/works/silo.pgsty.com.webp
      desc: 社区维护的 MinIO 分支，延续 S3 兼容对象存储的开源版本。
      url: 'https://silo.pgsty.com'
      external: true
    - title: OINK
      meta: Hugo 文档主题
      image: img/works/oink.pgsty.com.webp
      desc: 本地优先的 Hugo 工程文档主题，也就是这个站点用的框架。
      url: 'https://oink.pgsty.com'
      external: true
    - title: PIG
      meta: PG 包管理器
      image: img/works/pig.pgsty.com.webp
      desc: 一条命令装上任意 PostgreSQL 扩展，覆盖 EL / Debian / Ubuntu。
      url: 'https://pig.pgsty.com'
      external: true
    - title: SOW
      meta: 软件仓库管理器
      image: img/works/sow.pgsty.com.webp
      desc: 一次入库，处处分发 —— APT 与 YUM 软件仓库的构建与镜像。
      url: 'https://sow.pgsty.com'
      external: true
    - title: PG Exporter
      meta: 监控指标采集
      image: img/works/exp.pgsty.com.webp
      desc: 用 SQL 表达的 PostgreSQL 可观测性，600+ 指标，声明式采集器。
      url: 'https://exp.pgsty.com'
      external: true
    - title: CapsLock 补完计划
      meta: 键盘改造
      image: img/works/caps.vonng.com.webp
      desc: 把没什么用的大写锁定键，变成第五个修饰键。
      url: 'https://caps.vonng.com/zh'
      external: true
    - title: PGEXT.CLOUD
      meta: PostgreSQL 扩展目录
      image: img/works/ext.pgsty.com.webp
      desc: 2200+ PostgreSQL 扩展的索引、目录与元数据，以及 570+ 扩展的下载、安装与构建矩阵。
      url: 'https://ext.pgsty.com'
      external: true
    - title: PGSTY
      meta: 公司主页
      image: img/works/pgsty.com.webp
      desc: Pigsty 背后的团队，以及围绕它的开源与服务。
      url: 'https://pgsty.com/zh'
      external: true

