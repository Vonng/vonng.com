  publication:
    - title: DDIA
      meta: 中文翻译本
      image: img/works/ddia.vonng.com.webp
      desc: 《设计数据密集型应用》中文版，分布式系统的必读经典。
      url: 'https://ddia.vonng.com'
      external: true
    - title: PostgreSQL 内幕探索
      meta: 中文翻译本
      image: img/works/pgint.vonng.com.webp
      desc: 《PostgreSQL Internals》中文版，讲述 PostgreSQL 内核原理。
      url: 'https://pgint.vonng.com'
      external: true
    - title: pg.center
