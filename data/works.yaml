        - { label: GitHub, url: 'https://github.com/Vonng/Capslock', icon: fa-brands fa-github, external: true }
    - title: ACDAT
      meta: PG 高速多模式匹配扩展 · Apache-2.0
      image: img/works/acdat.webp
      desc: 基于双数组 Aho-Corasick 自动机的零依赖 C11 PostgreSQL 扩展，支持大规模字面量单遍扫描与替换。
      detail: '用纯正 C11 编写的零外部依赖 PostgreSQL 高性能多模式字符串匹配扩展。将成千上万个字面量模式词编译为紧凑的只读双数组 Aho-Corasick 自动机（Double-Array Trie）并直接存储在 PostgreSQL 变长元组（varlena）中，以 O(n) 线性时间复杂度单遍完成大规模敏感词检索、位置提取、计数与最长左优先批量替换。'
      tags: [C11, PostgreSQL 14–19, 双数组 AC 自动机, O(n) 单遍多模式扫描]
      url: 'https://github.com/pgsty/acdat'
      external: true
      links:
        - { label: GitHub 仓库, url: 'https://github.com/pgsty/acdat', icon: fa-brands fa-github, external: true }
        - { label: 扩展目录页, url: 'https://pgext.cloud/zh/e/acdat/', icon: fa-solid fa-puzzle-piece, external: true }

