  works_papers:
    - title: 'D-Bot: Database Diagnosis System using Large Language Models'
      meta: PVLDB Vol. 17, No. 10 · VLDB 2024
      image: img/works/dbot.jpg
      desc: '与清华大学数据库团队合著发表于 VLDB 2024：基于大语言模型的多 Agent 数据库自动根因诊断系统。'
      detail: '与清华大学李国良教授数据库团队（Database Group @ Tsinghua）及面壁智能合著，发表于数据库顶会 VLDB 2024（PVLDB Vol. 17, pp. 2514–2527）。针对复杂生产环境中的并发异常与慢查询雪崩，提出基于离线文档知识抽取、树搜索推理与多专家 Agent 协同（慢查询分析、资源争用、锁等待、配置核查）的自动根因诊断框架，在真实PostgreSQL 与云数据库故障基准上显著超越单模型基线。'
      tags: [VLDB 2024, LLM Multi-Agent, 数据库根因诊断, 清华大学 & Pigsty]
