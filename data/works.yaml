      detail: '社区持续维护的高性能开源 S3 兼容对象存储（MinIO 开源分支）。在上游移除开源管理控制台与二进制分发后，SILO 完整保留并持续维护服务端（silo）、命令行客户端（mcli）、图形化管理控制台（silo-console）及多平台 RPM/DEB/Docker 软件包，为 pgBackRest 备份归档、AI 数据湖与自建基础设施提供自主可控的对象存储底座。'
