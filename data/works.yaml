    - title: Capslock
      meta: 键盘效率改造 · MIT
      image: img/works/caps.vonng.com.webp
      desc: 把闲置的大写锁定键改造为第五个修饰键（Hyper），构建无需离开主键盘区的十六层控制平面。
      detail: '历经八年打磨的 macOS 与 Windows 键盘效率增强方案。通过 Karabiner-Elements 与 AutoHotkey 将左手小指旁闲置的 CapsLock 改造为第五修饰键（Hyper），在不离开主键盘区（Home Row）的前提下，叠加方向导航、窗口分屏、应用秒切、媒体控制与符号输入等 16 层正交控制平面，配套提供在线可视化键位配置生成器。'
      tags: [Karabiner & AHK, 16 层控制平面, 在线交互配置器, macOS & Windows]
      url: 'https://caps.vonng.com/'
      external: true
      links:
