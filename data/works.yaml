    - title: OINK
      meta: Hugo 工程文档主题 · Apache-2.0
      image: img/works/oink.pgsty.com.webp
      desc: 本地优先、零运行时外部依赖的 Hugo 工程文档与博客主题，也是本站与十余个文档站的底座。
      detail: '基于 Hugo Extended 构建的本地优先、零外部运行时依赖工程文档与技术出版主题。同一套主题外壳原生覆盖文档（Docs）、博客（Blog）、长篇书籍（Book）、落地页（Landing）、画廊（Expo）与 OpenAPI 参考六种内容形态，内置 Paper/Slate/Ink/Terminal 四套视觉预设、21 个按需加载组件与中英混合全文检索，无需 Node.js 工具链即可一条命令完成构建。'
