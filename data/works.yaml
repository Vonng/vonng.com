      image: img/works/barn.pgsty.com.webp
      desc: 从单份 YAML 清单拉起多节点 Linux 实验集群，或在 Apple Silicon 上运行原生隔离 macOS 虚拟机。
      detail: '专为基础设施工程与数据库高可用实验打造的本地轻量虚拟机集群管理器。通过单份声明式 YAML 清单，即可在数秒内拉起多节点 Linux 沙箱集群（对接 KVM/libvirt 或 Apple Virtualization），或管理 Apple Silicon 原生隔离 macOS 虚拟机，彻底替代沉重缓慢的传统 Vagrant + VirtualBox 工作流。'
