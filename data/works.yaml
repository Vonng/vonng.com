      external: true
    - title: 赛博经藏
      meta: Cyber Dharma
      image: img/works/dharma.vonng.com.webp
      desc: 七种传统绕着一台机器旋转 —— 关于技术与信仰的札记。
      url: 'https://dharma.vonng.com'
      external: true
    - title: 人工智能帝国
      meta: 中文翻译本
      image: img/works/aiempire.vonng.com.webp
      desc: Karen Hao《Empire of AI》中文版，山姆·奥特曼的 OpenAI：梦想与梦魇。
      url: 'https://aiempire.vonng.com'
      external: true
    - title: 产品思维工程师
      meta: 中文翻译本
      image: img/works/tpme.vonng.com.webp
      desc: 《The Product-Minded Engineer》中文版。
      url: 'https://tpme.vonng.com'
      external: true

