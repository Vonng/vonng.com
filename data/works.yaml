      image: img/works/pg.center.webp
      desc: postgresql.org 的完整中文镜像，含 PG 18 中文文档。
      url: 'https://pg.center'
      external: true
    - title: pgsql.cc
      meta: PG 运维文库
      image: img/works/pgsql.cc.webp
      desc: PostgreSQL 与周边组件的中英文运维文档聚合站。
      url: 'https://pgsql.cc'
      external: true
    - title: D-Bot
      meta: VLDB 论文
      image: img/works/dbot.jpg
      desc: Database Diagnosis System using Large Language Models，VLDB 2024。
      url: 'https://www.vldb.org/pvldb/vol17/p2514-li.pdf'
      external: true
    - title: hbase_fdw
      meta: NPC 2017 论文
