    - title: PIG
      meta: PG 扩展与包管理器 · Apache-2.0
      image: img/works/pig.pgsty.com.webp
      desc: 一条命令安装任意 PostgreSQL 扩展，全面覆盖 EL、Debian 与 Ubuntu 发行版。
      detail: '用 Go 编写的 PostgreSQL 命令行软件包与扩展管理器。对接系统原生 DNF/YUM 与 APT 包管理器以及 pgext.cloud 扩展目录，一条命令即可在 EL 8/9/10、Debian 12/13、Ubuntu 22.04/24.04（x86_64 与 ARM64）上完成软件源配置、PostgreSQL 内核安装与 570+ 预编译扩展的检索、安装、升级与源码构建。'
