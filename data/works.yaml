  # ==========================================================================
  # 1. Open-Source Projects (9 projects: 3×3 on Home, 1-column detail on /en/project/)
  # ==========================================================================
  project:
    - title: Pigsty
      meta: FOSS PostgreSQL RDS · Apache-2.0
      image: img/works/pigsty.io.webp
      desc: A battery-included PostgreSQL distribution — the local-first, free and open-source RDS alternative.
      detail: 'A battery-included, local-first open-source PostgreSQL RDS distribution (PostgreSQL In Great STYle). It integrates financial-grade high availability (Patroni), point-in-time recovery (pgBackRest), connection pooling (PgBouncer), service discovery (HAProxy), full-stack observability (pg_exporter + VictoriaMetrics + Grafana), and 570+ pre-packaged extensions into a self-hosted data platform on bare metal or VMs.'
      tags: [Ansible, PostgreSQL 14–19, 570+ Extensions, HA + PITR + Monitoring]
      url: 'https://pigsty.io'
      external: true
      links:
        - { label: English Portal, url: 'https://pigsty.io', icon: fa-solid fa-earth-americas, external: true }
        - { label: Chinese Portal, url: 'https://pigsty.cc', icon: fa-solid fa-globe, external: true }
        - { label: Live Demo, url: 'https://demo.pigsty.io', icon: fa-solid fa-chart-line, external: true }
        - { label: GitHub, url: 'https://github.com/pgsty/pigsty', icon: fa-brands fa-github, external: true }
    - title: SILO
      meta: S3-Compatible Object Storage · AGPL-3.0
      image: img/works/silo.pgsty.com.webp
      desc: The community-maintained MinIO fork that keeps high-performance S3-compatible object storage genuinely open source.
      detail: 'A community-maintained, high-performance S3-compatible object storage distribution forked from MinIO. After upstream stripped the graphical admin console and binary packages from open source, SILO preserves and maintains the complete server (silo), CLI client (mcli), web management console (silo-console), and native RPM/DEB/Docker artifacts for self-hosted backups, AI data lakes, and sovereign infrastructure.'
      tags: [Go, S3 Object Storage, Built-in Web Console, RPM / DEB / Docker]
      url: 'https://silo.pgsty.com'
      external: true
      links:
        - { label: Documentation, url: 'https://silo.pgsty.com/', icon: fa-solid fa-book, external: true }
        - { label: OINK Case, url: 'https://oink.pgsty.com/case/silo/', icon: fa-solid fa-palette, external: true }
        - { label: GitHub, url: 'https://github.com/pgsty/silo', icon: fa-brands fa-github, external: true }
    - title: OINK
      meta: Hugo Documentation Theme · Apache-2.0
      image: img/works/oink.pgsty.com.webp
      desc: A local-first, zero-external-dependency Hugo theme for engineering documentation, books, and technical blogs.
      detail: 'A local-first, zero-runtime-external-dependency Hugo Extended theme built for engineering documentation, multi-volume books, and technical blogs. A single unified shell powers six content models (Docs, Blog, Book, Landing, Expo, OpenAPI), four visual presets (Paper, Slate, Ink, Terminal), 21 on-demand components, and offline CJK/Latin search — with one `hugo` command and no Node.js toolchain.'
      tags: [Hugo 0.168+, 6 Content Shells, 21 Native Components, Zero npm Toolchain]
      url: 'https://oink.pgsty.com'
      external: true
      links:
        - { label: Official Site, url: 'https://oink.pgsty.com/', icon: fa-solid fa-globe, external: true }
        - { label: 15 Showcase Cases, url: 'https://oink.pgsty.com/case/', icon: fa-solid fa-layer-group, external: true }
        - { label: GitHub, url: 'https://github.com/pgsty/oink', icon: fa-brands fa-github, external: true }
    - title: PIG
      meta: Postgres Package Manager · Apache-2.0
      image: img/works/pig.pgsty.com.webp
      desc: One command, any PostgreSQL extension — native RPM and DEB package management across EL, Debian, and Ubuntu.
      detail: 'A Go command-line package manager for PostgreSQL and its extension ecosystem. Paired with the pgext.cloud catalog and native DNF/YUM and APT repositories, PIG lets engineers configure upstream repos, install PostgreSQL 14–19, and discover, install, upgrade, or build 570+ extensions with a single command across EL 8/9/10, Debian 12/13, and Ubuntu 22.04/24.04 (x86_64 & ARM64).'
      tags: [Go CLI, 570+ Extension Packages, EL / Debian / Ubuntu, x86_64 & ARM64]
      url: 'https://pig.pgsty.com'
      external: true
      links:
        - { label: Documentation, url: 'https://pig.pgsty.com/', icon: fa-solid fa-book, external: true }
        - { label: Extension Catalog, url: 'https://pgext.cloud', icon: fa-solid fa-puzzle-piece, external: true }
        - { label: GitHub, url: 'https://github.com/pgsty/pig', icon: fa-brands fa-github, external: true }
    - title: SOW
      meta: Repository Manager · Apache-2.0
      image: img/works/sow.pgsty.com.webp
      desc: Store once, serve everywhere — one self-contained binary for building, snapshotting, and publishing APT and YUM repos.
      detail: 'A self-contained Go binary for building, snapshotting, and serving private and public APT and YUM package repositories (Store Once, Serve Everywhere). Backed by a content-addressed package pool, SOW handles GPG signing, incremental metadata indexing, immutable release snapshots, and differential sync to local directories or S3/R2 object storage.'
      tags: [Go, APT & YUM Repos, Content-Addressed Pool, Snapshots & GPG]
      url: 'https://sow.pgsty.com'
      external: true
      links:
        - { label: Documentation, url: 'https://sow.pgsty.com/', icon: fa-solid fa-book, external: true }
        - { label: Architecture Essay, url: '/en/db/sow/', icon: fa-solid fa-newspaper }
        - { label: GitHub, url: 'https://github.com/pgsty/sow', icon: fa-brands fa-github, external: true }
    - title: pg_exporter
      meta: Observability & Metrics · Apache-2.0
      image: img/works/exp.pgsty.com.webp
      desc: PostgreSQL observability expressed in SQL — 600+ metrics via declarative YAML collectors for Prometheus.
      detail: 'A declarative Prometheus metrics exporter for PostgreSQL and PgBouncer. Every collector is defined in structured YAML and SQL with automatic server-version (PG 10–19) and extension gating, fine-grained query timeouts, caching, and health probes — exposing 600+ production observability metrics without recompiling a single line of Go.'
      tags: [Go, Prometheus Exporter, 600+ Declarative Metrics, PostgreSQL & PgBouncer]
      url: 'https://exp.pgsty.com'
      external: true
      links:
        - { label: Documentation, url: 'https://exp.pgsty.com/', icon: fa-solid fa-book, external: true }
        - { label: OINK Case, url: 'https://oink.pgsty.com/case/pg-exporter/', icon: fa-solid fa-palette, external: true }
        - { label: GitHub, url: 'https://github.com/pgsty/pg_exporter', icon: fa-brands fa-github, external: true }
    - title: Barn
      meta: Local VM Manager · Apache-2.0
      image: img/works/barn.pgsty.com.webp
      desc: Boot multi-node Linux labs from a single YAML inventory, or run isolated native macOS VMs on Apple Silicon.
      detail: 'A lightweight local virtual machine fleet manager designed for database clustering labs and infrastructure testing. From a single declarative YAML inventory, Barn boots multi-node Linux sandboxes in seconds (via KVM/libvirt or Apple Virtualization) or manages isolated native macOS VMs on Apple Silicon — replacing clunky Vagrant + VirtualBox setups.'
      tags: [Go, Linux & macOS VMs, Single-YAML Fleet, Apple Silicon Native]
      url: 'https://barn.pgsty.com/'
      external: true
      links:
        - { label: Documentation, url: 'https://barn.pgsty.com/', icon: fa-solid fa-book, external: true }
        - { label: GitHub, url: 'https://github.com/pgsty/barn', icon: fa-brands fa-github, external: true }
    - title: Capslock
      meta: Keyboard Ergonomics · MIT
      image: img/works/caps.vonng.com.webp
      desc: Turn the forgotten CapsLock key into a fifth modifier (Hyper) for sixteen home-row keyboard control planes.
      detail: 'An eight-year keyboard ergonomics system for macOS (Karabiner-Elements) and Windows (AutoHotkey). By turning the idle CapsLock key beside your left pinky into a fifth modifier (Hyper), Capslock unlocks 16 orthogonal home-row layers for cursor navigation, window tiling, app switching, media control, and symbol entry — complete with an interactive web customizer.'
      tags: [Karabiner & AHK, 16 Control Layers, Interactive Web Customizer, macOS & Windows]
      url: 'https://caps.vonng.com/'
      external: true
      links:
        - { label: Web Customizer, url: 'https://caps.vonng.com/', icon: fa-solid fa-sliders, external: true }
        - { label: OINK Case, url: 'https://oink.pgsty.com/case/capslock/', icon: fa-solid fa-palette, external: true }
        - { label: GitHub, url: 'https://github.com/Vonng/Capslock', icon: fa-brands fa-github, external: true }
    - title: ACDAT
      meta: Aho-Corasick Trie Extension · Apache-2.0
      image: img/works/acdat.webp
      desc: Zero-dependency C11 PostgreSQL extension compiling large literal pattern sets into a Double-Array Trie for O(n) scanning.
      detail: 'A zero-dependency C11 PostgreSQL extension for high-throughput multi-pattern string matching. ACDAT compiles thousands of literal patterns into a compact, read-only Aho-Corasick Double-Array Trie stored directly inside a PostgreSQL varlena datum, performing single-pass O(n) pattern matching, position extraction, counting, and leftmost-longest replacement.'
      tags: [C11, PostgreSQL 14–19, Double-Array Aho-Corasick, O(n) Single-Pass Scan]
      url: 'https://github.com/pgsty/acdat'
      external: true
      links:
        - { label: GitHub Repo, url: 'https://github.com/pgsty/acdat', icon: fa-brands fa-github, external: true }
        - { label: Extension Catalog, url: 'https://pgext.cloud/e/acdat/', icon: fa-solid fa-puzzle-piece, external: true }

