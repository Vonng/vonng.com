      meta: 可观测性与指标采集 · Apache-2.0
      image: img/works/exp.pgsty.com.webp
      desc: 用 SQL 表达的 PostgreSQL 可观测性，内置 600+ 指标的声明式 Prometheus 采集器。
      detail: '面向 PostgreSQL 与 PgBouncer 的声明式 Prometheus 指标导出器。所有采集逻辑均通过结构化 YAML 与 SQL 定义，无需重新编译即可按服务器版本（PG 10–19）与已安装扩展自动启用或裁剪采集分支，内置 600+ 生产级可观测性指标、超时熔断、缓存控制与健康探针，是 Pigsty 监控体系的核心采集引擎。'
