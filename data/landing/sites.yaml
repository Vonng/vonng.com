      partial: landing/sections/link-cards.html

  portals:
    level: 1
    hide_eyebrow: true
    title: Portals & Showcase Sites
    text: Six flagship portals spanning the PostgreSQL knowledge graph, extension catalog, multilingual component manuals, technical essays, and enterprise support.
    head_links:
      - { label: pg.center, url: 'https://pg.center', icon: fa-solid fa-sitemap, external: true }
      - { label: pgsql.cc, url: 'https://pgsql.cc', icon: fa-solid fa-file-lines, external: true }
      - { label: pgext.cloud, url: 'https://pgext.cloud', icon: fa-solid fa-puzzle-piece, external: true }
      - { label: OINK Showcase, url: 'https://oink.pgsty.com/case/', icon: fa-solid fa-palette, external: true }
    columns: 2
    detailed: true
    items_from: sites_portals

  distro:
    eyebrow: Pigsty Distribution & Live Demo
    text: Standalone English and Chinese documentation portals, the commercial Pro edition archive, and the live Grafana observability playground for Pigsty.
    columns: 2
    detailed: true
    items_from: sites_distro

  infra:
    eyebrow: Open-Source Infrastructure & OINK Showcases
    text: Official documentation portals for SILO S3 storage, the OINK Hugo theme, PIG extension manager, SOW repo builder, pg_exporter, and Barn VM manager.
    columns: 2
    detailed: true
    items_from: sites_infra

  originals:
    eyebrow: Original Monographs, Digital Canons & Interactive Tools
    text: Standalone book and tool sites built with OINK’s Book shell and custom interactive shells — spanning PostgreSQL engineering, philosophy, and keyboard ergonomics.
    columns: 2
    detailed: true
    items_from: sites_originals

  books:
    eyebrow: Translated Classics & PostgreSQL Tutorial Book Sites
    text: Dedicated book portals for DDIA, TPME, PostgreSQL Internals, Monitoring, Query Optimization, and hands-on tutorials, plus Dalibo and Postgres Pro training sites.
    columns: 2
    detailed: true
    items_from: sites_books
    series_from: training_series
