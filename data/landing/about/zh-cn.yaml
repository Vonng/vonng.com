bio:
  eyebrow: 个人履历
  title: 我是谁，我在做什么
  body: |
    我叫**冯若航**，在网上通常被称为 **Vonng**。自 2015 年起持续深耕 PostgreSQL 与基础设施领域 —— 我用数据库，造数据库工具，也写关于数据库的书与文章。

    2018 年我发起了开源项目 [**Pigsty**](https://pigsty.cc)（*PostgreSQL In Great STYle*）：一套本地优先、开箱即用的开源 PostgreSQL RDS 发行版。它将高可用（Patroni）、时间点恢复（pgBackRest）、连接池（PgBouncer）、可观测性栈（[**pg_exporter**](https://exp.pgsty.com) + Grafana/VictoriaMetrics）以及 [**pgext.cloud**](https://pgext.cloud/zh) 收录的 **2200+ 扩展目录与 570+ 预编译扩展包** 整合成一套可自主掌控的数据基础设施，帮助全球上万名开发者与企业在裸金属和虚拟机上跑出云数据库水准的体验，而不必支付昂贵的云溢价。

    在创立 [**pgsty.com**](https://pgsty.com/zh) 全职投入开源之前，我曾先后在 **阿里巴巴（Alibaba）**、**探探（TanTan）** 与 **苹果（Apple）** 担任研发工程师、首席 DBA 与基础架构师，亲手设计并管理过数百套核心生产环境 PostgreSQL 集群。

    工程之外，我独立翻译了分布式系统经典 [**《设计数据密集型应用》（DDIA）**](https://ddia.vonng.com)、[**《PostgreSQL 技术内幕》**](https://pgint.vonng.com)、[**《PostgreSQL 18 内参》**](https://int18.pgsql.cc/zh18/)、[**《PostgreSQL 监控》**](https://pgmon.pgsql.cc/) 与 [**《PostgreSQL 18 查询优化》**](https://pgqpt.pgsql.cc/)，维护着 PostgreSQL 知识库 [**pg.center**](https://pg.center/zh) 与中文文档站 [**pgsql.cc**](https://pgsql.cc)，并在公众号《老冯云数》与本站专栏中持续输出技术评论（全网读者约 10 万）。完整社区贡献可见我的 [**PostgreSQL 贡献者档案**](/dossier/)。

    工作之余，我热爱徒步、旅行、历史哲学与电子游戏 —— 这些足迹散落在 [**赛博经藏**](https://dharma.vonng.com)、[**行万里路**](/trip/) 与 [**人生旅途**](/misc/) 之中。

