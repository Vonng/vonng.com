columns:
  eyebrow: 专栏
  title: 也写文章
  text: 本站的文章按主题分成几个专栏，各自有独立的 RSS 订阅。
  columns: 3
  unit: 篇
  items:
    - page: /db
      title: 数据库老司机
      desc: 数据库行业的动态、新闻、调查、理念与最佳实践。
    - page: /cloud
      title: 云计算泥石流
      desc: 云计算、下云与基础设施自建的深度思考与成本分析。
    - page: /ai
      title: Agent 探路者
      desc: 关于 AI、Agent、LLM，以及 AI 与数据库之间的一切。
    - page: /pg
      title: Postgres 大法师
      desc: PostgreSQL 生态进展，以及开发、运维、诊断与调优的经验。
    - page: /trip
      title: 行万里路
      desc: 旅行、徒步与、游记与见闻。山川湖海，风物人情。
    - page: /misc
      title: 人生旅途
      desc: 随笔与杂谈，闲杂记录，也许与技术有关，或者完全无关。

