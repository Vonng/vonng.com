bio:
  eyebrow: Biography
  title: Who I am, and what I work on
  body: |
    I am **Ruohang Feng**, widely known online as **Vonng**. Since 2015 I have focused on PostgreSQL and data infrastructure — building database tooling, running large-scale clusters, and writing extensively about databases and cloud economics.

    In 2018 I created [**Pigsty**](https://pigsty.io) (*PostgreSQL In Great STYle*) — a battery-included, local-first open-source PostgreSQL RDS distribution. It integrates high availability (Patroni), point-in-time recovery (pgBackRest), connection pooling (PgBouncer), observability ([**pg_exporter**](https://exp.pgsty.com) + Grafana/VictoriaMetrics), and the [**pgext.cloud**](https://pgext.cloud) supply chain (**2,200+ cataloged extensions and 570+ pre-built binary packages** across 16 Linux distros) into a self-hosted RDS that gives anyone cloud-grade database capability on bare metal without paying the cloud premium.

    Before founding [**pgsty.com**](https://pgsty.com) to work on open-source infrastructure full-time, I served as a software engineer, lead DBA, and infrastructure architect at **Alibaba**, **TanTan**, and **Apple**, where I designed and operated hundreds of production PostgreSQL clusters.

    Outside of engineering, I translated [**Designing Data-Intensive Applications (DDIA)**](https://ddia.vonng.com), [**Internals of PostgreSQL**](https://pgint.vonng.com), [**PostgreSQL 18 Internals**](https://int18.pgsql.cc/zh18/), [**PostgreSQL Monitoring**](https://pgmon.pgsql.cc/), and [**PostgreSQL 18 Query Optimization**](https://pgqpt.pgsql.cc/) into Chinese; maintain the [**pg.center**](https://pg.center) knowledge graph and [**pgsql.cc**](https://pgsql.cc) documentation portal; and write for a combined readership of ~100,000 engineers. For a structured record of my ecosystem work, see my [**PostgreSQL Contributor Dossier**](/en/dossier/).

    Away from the terminal, I hike, travel, study comparative religion and philosophy, and play strategy games — documented in [**Cyber Dharma**](https://dharma.vonng.com), [**Travel Notes**](/en/trip/), and [**Miscellaneous**](/en/misc/).

